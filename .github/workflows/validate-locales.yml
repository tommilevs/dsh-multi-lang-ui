name: Validate community locale packs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

concurrency:
  group: locale-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted validator from the target branch
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-validator
          persist-credentials: false

      - name: Check out contribution data only
        uses: actions/checkout@v4.4.0
        with:
          # Intentional opt-out: fork PR HEAD data is read only as JSON beneath contributions/.
          # The trusted validator runs from the base SHA; no PR code, scripts, or workflows execute.
          allow-unsafe-pr-checkout: true
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-data
          sparse-checkout: contributions
          sparse-checkout-cone-mode: true
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Validate all submitted locale packs
        run: node trusted-validator/scripts/validate-locales.mjs candidate-data/contributions

  approve-translation-only:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted policy from the target branch
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-policy
          persist-credentials: false

      - name: Approve validated translation-only changes
        uses: actions/github-script@v9
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const { approveTranslationPullRequest } = require('./trusted-policy/lib/translation-pr-approval.cjs')
            await approveTranslationPullRequest({
              github,
              context,
              core,
              validationResult: process.env.VALIDATION_RESULT,
              trustedPolicyDirectory: 'trusted-policy',
            })

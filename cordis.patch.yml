# dsh-multi-lang-ui: строка плагина в дереве загрузчика профиля.
#
# Хост-половина регистрирует только схему настройки (lib/index.js), весь перевод
# живёт в браузере (lib/client.js). Строка нужна, чтобы сканер клиентских бандлов
# увидел пакет и отдал его странице.
- insert:
    - id: russian-lang
      name: '@tommilevs/dsh-multi-lang-ui'
